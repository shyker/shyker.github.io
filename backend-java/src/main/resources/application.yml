server:
  port: 8081

spring:
  application:
    name: blog-api
  datasource:
    url: jdbc:sqlite:${BLOG_DB_PATH:./data/blog.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 220MB

app:
  auth:
    password: ${DIARY_PASSWORD:change-me}
  admin:
    password-hash: ${ADMIN_PASSWORD_HASH:}
    development-password: ${ADMIN_DEVELOPMENT_PASSWORD:change-me}
    jwt-secret: ${ADMIN_JWT_SECRET:change-this-secret-before-production}
    token-hours: 8
  content:
    media-dir: ${BLOG_MEDIA_DIR:./data/media}
    media-base-url: ${BLOG_MEDIA_BASE_URL:http://localhost:8081/media}
    seed-dir: ${BLOG_SEED_DIR:../src/posts}
  cors:
    origins: ${BLOG_CORS_ORIGINS:http://localhost:3000,https://shyker.github.io}
